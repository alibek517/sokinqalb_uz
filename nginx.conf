server {
    listen 80;
    server_name sokinqalb.uz www.sokinqalb.uz localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sokinqalb.uz www.sokinqalb.uz localhost;

    ssl_certificate /etc/letsencrypt/live/sokinqalb.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sokinqalb.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/svg+xml;

    # SPA routing - redirect all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
